<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hadron Nova</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060f;
            --surface: #0d0d22;
            --card: #14142f;
            --card2: #1a1a38;
            --accent: #8b6cff;
            --accent-glow: #a78bfa;
            --accent2: #00e0b0;
            --gold: #f7c948;
            --gold-glow: #ffe082;
            --text: #e8e8ff;
            --muted: #7a7aaa;
            --border: rgba(139, 108, 255, 0.22);
            --border-glow: rgba(139, 108, 255, 0.45);
            --danger: #ff5e7a;
            --danger-glow: #ff8da1;
            --board-bg: #08081a;
            --cell-bg: rgba(255, 255, 255, 0.025);
            --cell-border: rgba(255, 255, 255, 0.04);
            --radius-sm: 10px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --font-orbit: 'Orbitron', sans-serif;
            --font-body: 'Nunito', sans-serif;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.22s cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-bounce: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-spring: 0.4s cubic-bezier(0.22, 1.2, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* ── Animated background ── */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }
        .bg-orb.orb1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            top: -80px;
            left: -60px;
            animation: orbFloat1 14s ease-in-out infinite;
        }
        .bg-orb.orb2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
            bottom: -70px;
            right: -50px;
            animation: orbFloat2 18s ease-in-out infinite;
        }
        .bg-orb.orb3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #f59e0b 0%, transparent 70%);
            top: 40%;
            left: 50%;
            animation: orbFloat3 20s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(60px, 40px) scale(1.15);
            }
            50% {
                transform: translate(20px, -30px) scale(0.9);
            }
            75% {
                transform: translate(-30px, 20px) scale(1.08);
            }
        }
        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(-50px, -60px) scale(1.2);
            }
            66% {
                transform: translate(30px, -10px) scale(0.85);
            }
        }
        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.4);
            }
        }

        /* starfield */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.6);
            }
        }

        /* ── App container ── */
        .app {
            max-width: 430px;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            padding: 0 4px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px 8px;
            background: linear-gradient(180deg, rgba(139, 108, 255, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-gem {
            font-size: 26px;
            animation: logoBounce 2.5s ease-in-out infinite;
        }
        @keyframes logoBounce {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            30% {
                transform: translateY(-6px) rotate(8deg);
            }
            60% {
                transform: translateY(0) rotate(-5deg);
            }
            80% {
                transform: translateY(-2px) rotate(3deg);
            }
        }
        .header-title {
            font-family: var(--font-orbit);
            font-size: 17px;
            font-weight: 900;
            background: linear-gradient(135deg, #c4b5fd, #5eead4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1.5px;
        }
        .header-badge {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            background: var(--card);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            letter-spacing: 0.5px;
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 10px 14px 6px;
        }
        .tab {
            flex: 1;
            padding: 10px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: transparent;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .tab::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), #5a3dd4);
            opacity: 0;
            transition: opacity var(--transition-smooth);
            border-radius: var(--radius);
            z-index: -1;
        }
        .tab.active {
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px rgba(139, 108, 255, 0.35);
        }
        .tab.active::after {
            opacity: 1;
        }
        .tab:active {
            transform: scale(0.96);
        }

        /* ── Game View ── */
        .game-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 10px 10px;
        }

        /* ── Score Bar ── */
        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 4px 0 8px;
            padding: 0 2px;
        }
        .score-main {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 10px;
            font-weight: 800;
            color: var(--muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .score-value {
            font-family: var(--font-orbit);
            font-size: 30px;
            font-weight: 900;
            color: var(--text);
            line-height: 1;
            transition: all var(--transition-fast);
        }
        .score-record {
            text-align: right;
        }
        .score-record .score-value {
            font-size: 22px;
            color: var(--gold);
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.3);
        }

        /* ── Stats Row ── */
        .stats-row {
            display: flex;
            gap: 7px;
            margin-bottom: 8px;
        }
        .stat-pill {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all var(--transition-fast);
        }
        .stat-pill-label {
            font-size: 9px;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .stat-pill-value {
            font-family: var(--font-orbit);
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            transition: all var(--transition-fast);
        }
        .stat-pill.wave .stat-pill-value {
            color: var(--accent2);
        }
        .stat-pill.combo .stat-pill-value {
            color: #ff6b9d;
            transition: all 0.1s;
        }
        .stat-pill.combo.pulse .stat-pill-value {
            animation: comboPulse 0.3s ease-out;
        }
        @keyframes comboPulse {
            0% {
                transform: scale(1.5);
                color: #fff;
            }
            100% {
                transform: scale(1);
                color: #ff6b9d;
            }
        }
        .stat-pill.coins .stat-pill-value {
            color: var(--gold);
        }

        /* ── Wave Progress ── */
        .wave-progress-wrap {
            margin-bottom: 8px;
            background: var(--card);
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .wave-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 20px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px rgba(139, 108, 255, 0.5);
        }

        /* ── Board ── */
        .board-wrapper {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: visible;
            border: 2px solid var(--border-glow);
            box-shadow: 0 0 50px rgba(139, 108, 255, 0.18), 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.3);
            background: var(--board-bg);
            margin-bottom: 8px;
            transition: transform 0.1s;
            will-change: transform;
        }
        .board-wrapper.shake {
            animation: boardShake 0.4s ease-out;
        }
        @keyframes boardShake {
            0%,
            100% {
                transform: translate(0);
            }
            10% {
                transform: translate(-3px, 2px);
            }
            25% {
                transform: translate(3px, -1px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            55% {
                transform: translate(2px, 1px);
            }
            70% {
                transform: translate(-1px, -1px);
            }
            85% {
                transform: translate(1px, 0);
            }
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
            padding: 5px;
            touch-action: none;
            position: relative;
        }
        .cell {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            transition: transform 0.1s, background 0.15s;
            overflow: visible;
            z-index: 1;
        }
        .cell:active {
            transform: scale(0.88);
            transition: transform 0.06s;
        }
        .cell.selected {
            z-index: 5;
            animation: selectedGlow 0.7s ease-in-out infinite alternate;
        }
        @keyframes selectedGlow {
            from {
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 25px rgba(139, 108, 255, 0.5);
                border-color: rgba(255, 255, 255, 0.6);
            }
            to {
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.8), 0 0 40px rgba(139, 108, 255, 0.8);
                border-color: rgba(255, 255, 255, 0.9);
            }
        }
        .cell.hint-glow {
            animation: hintPulse 0.55s ease-in-out infinite alternate;
        }
        @keyframes hintPulse {
            from {
                filter: brightness(1);
                box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
            }
            to {
                filter: brightness(1.6) saturate(1.5);
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.5);
            }
        }
        .cell.matched {
            animation: matchPop 0.38s ease-out forwards;
            z-index: 3;
        }
        @keyframes matchPop {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1);
            }
            35% {
                transform: scale(1.3);
                opacity: 0.9;
                filter: brightness(2);
            }
            100% {
                transform: scale(0);
                opacity: 0;
                filter: brightness(3);
            }
        }
        .cell.falling {
            animation: fallIn 0.28s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
        }
        @keyframes fallIn {
            from {
                transform: translateY(-55px) scale(0.7);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .cell.new-gem {
            animation: newGemAppear 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes newGemAppear {
            from {
                transform: scale(0) rotate(-25deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ── Gem ── */
        .gem {
            width: 82%;
            height: 82%;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(17px, 4.8vw, 28px);
            position: relative;
            transition: transform 0.18s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.18s;
            will-change: transform;
            pointer-events: none;
        }
        .gem::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 3px;
            width: 38%;
            height: 28%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            transform: rotate(-8deg);
            pointer-events: none;
        }
        .gem::after {
            content: '';
            position: absolute;
            bottom: 3px;
            right: 4px;
            width: 20%;
            height: 16%;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 3px;
            transform: rotate(-5deg);
            pointer-events: none;
        }
        .gem-0 {
            background: linear-gradient(145deg, #60a5fa, #1d4ed8);
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .gem-1 {
            background: linear-gradient(145deg, #a78bfa, #6d28d9);
            box-shadow: 0 3px 10px rgba(139, 92, 246, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .gem-2 {
            background: linear-gradient(145deg, #f87171, #b91c1c);
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .gem-3 {
            background: linear-gradient(145deg, #4ade80, #15803d);
            box-shadow: 0 3px 10px rgba(34, 197, 94, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .gem-4 {
            background: linear-gradient(145deg, #fbbf24, #b45309);
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .gem-5 {
            background: linear-gradient(145deg, #e2e8f0, #94a3b8);
            box-shadow: 0 3px 10px rgba(203, 213, 225, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* ── Boosters ── */
        .boosters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .booster-btn {
            flex: 1;
            padding: 8px 4px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .booster-btn:active {
            transform: scale(0.93);
            transition: transform 0.08s;
        }
        .booster-btn.active-booster {
            border-color: var(--accent-glow);
            background: rgba(139, 108, 255, 0.2);
            box-shadow: 0 0 20px rgba(139, 108, 255, 0.45), inset 0 0 20px rgba(139, 108, 255, 0.1);
            animation: boosterGlow 1s ease-in-out infinite alternate;
        }
        @keyframes boosterGlow {
            from {
                box-shadow: 0 0 15px rgba(139, 108, 255, 0.35);
            }
            to {
                box-shadow: 0 0 30px rgba(139, 108, 255, 0.7);
            }
        }
        .booster-icon {
            font-size: 22px;
            transition: transform var(--transition-fast);
        }
        .booster-btn:active .booster-icon {
            transform: scale(1.2);
        }
        .booster-count {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            transition: color var(--transition-fast);
        }
        .booster-btn.active-booster .booster-count {
            color: var(--accent-glow);
        }
        .booster-btn.depleted {
            opacity: 0.35;
            pointer-events: none;
        }

        /* ── Main Button ── */
        .main-btn {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius);
            border: none;
            font-family: var(--font-orbit);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            background: linear-gradient(135deg, #8b6cff, #5a3dd4);
            color: #fff;
            box-shadow: 0 6px 25px rgba(139, 108, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        .main-btn:active {
            transform: scale(0.96);
            transition: transform 0.08s;
        }
        .main-btn.paused {
            background: linear-gradient(135deg, #22c55e, #15803d);
            box-shadow: 0 6px 25px rgba(34, 197, 94, 0.45);
        }
        .main-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 50%);
            pointer-events: none;
        }
        .hint-text {
            text-align: center;
            font-size: 11px;
            color: var(--muted);
            padding: 4px 0 2px;
            font-weight: 600;
            transition: color var(--transition-fast);
            min-height: 18px;
        }
        .hint-text.alert {
            color: var(--danger-glow);
            animation: hintFlash 0.5s ease-out;
        }
        @keyframes hintFlash {
            0%,
            100% {
                color: var(--muted);
            }
            50% {
                color: #ff8da1;
            }
        }

        /* ── Wave Banner ── */
        .wave-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.3);
            background: rgba(10, 10, 30, 0.96);
            border: 2px solid var(--accent-glow);
            border-radius: var(--radius-xl);
            padding: 28px 36px;
            text-align: center;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 70px rgba(139, 108, 255, 0.6), 0 0 120px rgba(0, 224, 176, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .wave-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }
        .wave-banner-title {
            font-family: var(--font-orbit);
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 40px rgba(139, 108, 255, 0.9);
        }
        .wave-banner-sub {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 0.5px;
        }
        .wave-banner-bonus {
            font-size: 26px;
            font-weight: 900;
            color: var(--gold);
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.5);
        }

        /* ── Game Over ── */
        .gameover-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .gameover-overlay.show {
            opacity: 1;
            pointer-events: all;
        }
        .gameover-card {
            background: var(--card2);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-xl);
            padding: 34px 28px;
            text-align: center;
            width: 86%;
            max-width: 350px;
            box-shadow: 0 0 70px rgba(139, 108, 255, 0.35), 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.75);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .gameover-overlay.show .gameover-card {
            transform: scale(1);
        }
        .gameover-emoji {
            font-size: 56px;
            margin-bottom: 14px;
            animation: floatEmoji 2s ease-in-out infinite;
        }
        @keyframes floatEmoji {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .gameover-title {
            font-family: var(--font-orbit);
            font-size: 21px;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 8px;
        }
        .gameover-score {
            font-family: var(--font-orbit);
            font-size: 40px;
            font-weight: 900;
            color: var(--accent-glow);
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(139, 108, 255, 0.6);
        }
        .gameover-best {
            font-size: 13px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 22px;
        }
        .gameover-btn {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius);
            border: none;
            background: linear-gradient(135deg, #8b6cff, #5a3dd4);
            color: #fff;
            font-family: var(--font-orbit);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(139, 108, 255, 0.5);
            transition: all var(--transition-smooth);
        }
        .gameover-btn:active {
            transform: scale(0.95);
        }

        /* ── Particles & Float Score ── */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 18px;
            z-index: 999;
            animation: particleFly 0.9s ease-out forwards;
        }
        @keyframes particleFly {
            0% {
                transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -130px) scale(1.1) rotate(40deg);
                opacity: 0;
            }
        }
        .float-score {
            position: fixed;
            pointer-events: none;
            font-family: var(--font-orbit);
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 18px rgba(139, 108, 255, 0.9), 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 999;
            animation: floatScoreUp 1s ease-out forwards;
            white-space: nowrap;
        }
        @keyframes floatScoreUp {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            30% {
                transform: translate(-50%, -80px) scale(1.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -140px) scale(0.9);
                opacity: 0;
            }
        }
        .combo-popup {
            position: fixed;
            pointer-events: none;
            font-family: var(--font-orbit);
            font-size: 26px;
            font-weight: 900;
            color: #ff6b9d;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.9), 0 0 60px rgba(255, 107, 157, 0.5);
            z-index: 998;
            animation: comboPopupFly 1.3s ease-out forwards;
        }
        @keyframes comboPopupFly {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            25% {
                transform: translate(-50%, -60%) scale(1.5);
                opacity: 1;
            }
            60% {
                transform: translate(-50%, -90%) scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: translate(-50%, -140%) scale(0.7);
                opacity: 0;
            }
        }

        /* ── Ripple ── */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0);
            animation: rippleOut 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes rippleOut {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ── Leaderboard ── */
        .leaderboard-view {
            padding: 0 10px 12px;
            display: none;
            flex-direction: column;
            gap: 7px;
        }
        .leaderboard-view.active {
            display: flex;
        }
        .lb-filter {
            display: flex;
            gap: 6px;
            margin-bottom: 2px;
        }
        .lb-filter-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-smooth);
        }
        .lb-filter-btn.active {
            background: rgba(139, 108, 255, 0.2);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 15px rgba(139, 108, 255, 0.3);
        }
        .lb-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all var(--transition-smooth);
        }
        .lb-item.me {
            border-color: var(--accent);
            background: rgba(139, 108, 255, 0.1);
            box-shadow: 0 0 20px rgba(139, 108, 255, 0.2);
        }
        .lb-rank {
            font-family: var(--font-orbit);
            font-size: 15px;
            font-weight: 900;
            width: 30px;
            text-align: center;
            flex-shrink: 0;
        }
        .lb-rank.gold {
            color: var(--gold);
        }
        .lb-rank.silver {
            color: #c0c0c0;
        }
        .lb-rank.bronze {
            color: #cd7f32;
        }
        .lb-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #5a3dd4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .lb-info {
            flex: 1;
            min-width: 0;
        }
        .lb-name {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lb-score-num {
            font-family: var(--font-orbit);
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            flex-shrink: 0;
        }
        .league-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        .league-icon {
            font-size: 50px;
        }
        .league-name {
            font-family: var(--font-orbit);
            font-size: 15px;
            font-weight: 900;
            color: var(--text);
        }
        .league-rank {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }
        .league-all-btn {
            width: 100%;
            padding: 11px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent-glow);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-smooth);
            margin-top: 4px;
        }
        .league-all-btn:active {
            background: rgba(139, 108, 255, 0.15);
        }

        /* ── Responsive ── */
        @media (max-width: 380px) {
            .header-title {
                font-size: 14px;
            }
            .gem {
                font-size: clamp(14px, 4vw, 22px);
            }
            .score-value {
                font-size: 24px;
            }
            .score-record .score-value {
                font-size: 18px;
            }
            .stat-pill-value {
                font-size: 13px;
            }
            .wave-banner-title {
                font-size: 26px;
            }
        }
        @media (min-width: 420px) {
            .board-grid {
                gap: 4px;
                padding: 7px;
            }
            .gem {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Animated background -->
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="stars" id="stars-container"></div>

    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header-logo">
                <div class="header-gem">💎</div>
                <div class="header-title">HADRON NOVA</div>
            </div>
            <div class="header-badge">v3.0</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" id="tab-game" onclick="switchTab('game')">🎮 Игра</button>
            <button class="tab" id="tab-lb" onclick="switchTab('lb')">🏆 Топы</button>
        </div>

        <!-- Game View -->
        <div class="game-view" id="game-view">
            <div class="score-bar">
                <div class="score-main">
                    <div class="score-label">Счёт</div>
                    <div class="score-value" id="score-display">0</div>
                </div>
                <div class="score-record">
                    <div class="score-label">Рекорд</div>
                    <div class="score-value" id="record-display">0</div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-pill wave">
                    <div class="stat-pill-label">🌊 Волна</div>
                    <div class="stat-pill-value" id="wave-display">1</div>
                </div>
                <div class="stat-pill combo" id="combo-pill">
                    <div class="stat-pill-label">🔥 Комбо</div>
                    <div class="stat-pill-value" id="combo-display">x1</div>
                </div>
                <div class="stat-pill coins">
                    <div class="stat-pill-label">🪙 Монеты</div>
                    <div class="stat-pill-value" id="coins-display">0</div>
                </div>
            </div>

            <div class="wave-progress-wrap">
                <div class="wave-progress-fill" id="wave-progress-fill" style="width: 0%"></div>
            </div>

            <div class="board-wrapper" id="board-wrapper">
                <div class="board-grid" id="board-grid"></div>
            </div>

            <div class="boosters-row">
                <button class="booster-btn" id="booster-bomb" onclick="activateBooster('bomb')">
                    <div class="booster-icon">💣</div>
                    <div class="booster-count" id="bomb-count">3</div>
                </button>
                <button class="booster-btn" id="booster-swirl" onclick="activateBooster('swirl')">
                    <div class="booster-icon">🌀</div>
                    <div class="booster-count" id="swirl-count">2</div>
                </button>
                <button class="booster-btn" id="booster-bolt" onclick="activateBooster('bolt')">
                    <div class="booster-icon">⚡</div>
                    <div class="booster-count" id="bolt-count">3</div>
                </button>
            </div>

            <button class="main-btn" id="main-btn" onclick="handleMainBtn()">▶ Новая игра</button>
            <div class="hint-text" id="hint-text">Собирайте комбинации и зарабатывайте очки</div>
        </div>

        <!-- Leaderboard View -->
        <div class="leaderboard-view" id="lb-view">
            <div class="lb-filter">
                <button class="lb-filter-btn active" id="lb-world-btn" onclick="setLbFilter('world')">🌍 Мир</button>
                <button class="lb-filter-btn" id="lb-friends-btn" onclick="setLbFilter('friends')">👥 Друзья</button>
            </div>
            <div id="lb-list"></div>
            <div class="league-card" id="league-card">
                <div class="league-icon">🏆</div>
                <div class="league-name">Алмазная лига</div>
                <div class="league-rank" id="league-rank-text">Топ 12%</div>
                <button class="league-all-btn">Все лиги →</button>
            </div>
        </div>
    </div>

    <!-- Wave Banner -->
    <div class="wave-banner" id="wave-banner">
        <div class="wave-banner-title" id="wb-title">WAVE 1</div>
        <div class="wave-banner-sub" id="wb-sub">Бонус за волну!</div>
        <div class="wave-banner-bonus" id="wb-bonus">+50 🪙</div>
    </div>

    <!-- Game Over -->
    <div class="gameover-overlay" id="gameover-overlay">
        <div class="gameover-card">
            <div class="gameover-emoji">💫</div>
            <div class="gameover-title">Игра окончена!</div>
            <div class="gameover-score" id="go-score">0</div>
            <div class="gameover-best" id="go-best">Рекорд: 0</div>
            <button class="gameover-btn" onclick="startNewGame()">▶ НОВАЯ ИГРА</button>
        </div>
    </div>

    <script>
        (function() {
            // ── Constants ──
            const COLS = 6,
                ROWS = 6;
            const GEM_TYPES = 6;
            const GEM_EMOJIS = ['💎', '🔮', '❤️', '💚', '🟠', '⚪'];
            const WAVE_TARGETS = [8, 14, 20, 28, 36, 46, 56, 68, 80, 100];

            // ── State ──
            let grid = [];
            let selected = null;
            let score = 0,
                record = 0,
                wave = 1,
                combo = 1,
                coins = 0;
            let moves = 0,
                matchesInWave = 0;
            let boosters = { bomb: 3, swirl: 2, bolt: 3 };
            let activeBooster = null;
            let gameRunning = false;
            let paused = false;
            let processing = false;
            let gameOverShown = false;

            // ── DOM refs ──
            const $ = (id) => document.getElementById(id);
            const boardGrid = $('board-grid');
            const boardWrapper = $('board-wrapper');
            const scoreDisplay = $('score-display');
            const recordDisplay = $('record-display');
            const waveDisplay = $('wave-display');
            const comboDisplay = $('combo-display');
            const comboPill = $('combo-pill');
            const coinsDisplay = $('coins-display');
            const waveProgressFill = $('wave-progress-fill');
            const mainBtn = $('main-btn');
            const hintText = $('hint-text');
            const waveBanner = $('wave-banner');
            const gameoverOverlay = $('gameover-overlay');

            // ── Starfield ──
            function createStarfield() {
                const container = $('stars-container');
                const count = 55;
                let html = '';
                for (let i = 0; i < count; i++) {
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const size = Math.random() * 2.2 + 0.8;
                    const dur = Math.random() * 3 + 2.5;
                    const delay = Math.random() * 4;
                    html +=
                        `<div class="star" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s;"></div>`;
                }
                container.innerHTML = html;
            }
            createStarfield();

            // ── Helpers ──
            function getWaveTarget(w) {
                return w <= WAVE_TARGETS.length ? WAVE_TARGETS[w - 1] : WAVE_TARGETS[WAVE_TARGETS.length - 1] + (w -
                    WAVE_TARGETS.length) * 20;
            }

            function randomGem() { return Math.floor(Math.random() * GEM_TYPES); }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            function getCellEl(r, c) {
                return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            }

            function getCellCenter(el) {
                const rect = el.getBoundingClientRect();
                return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
            }

            // ── Grid ──
            function initGrid() {
                grid = [];
                for (let r = 0; r < ROWS; r++) {
                    grid.push([]);
                    for (let c = 0; c < COLS; c++) {
                        grid[r].push(randomGem());
                    }
                }
                // Ensure no initial matches and at least one valid move
                let attempts = 0;
                while ((findMatches().length > 0 || !hasValidMoves()) && attempts < 200) {
                    for (let r = 0; r < ROWS; r++)
                        for (let c = 0; c < COLS; c++)
                            grid[r][c] = randomGem();
                    attempts++;
                }
            }

            function findMatches() {
                const matched = new Set();
                // horizontal
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS - 2; c++) {
                        const t = grid[r][c];
                        if (t !== null && t === grid[r][c + 1] && t === grid[r][c + 2]) {
                            let len = 3;
                            while (c + len < COLS && grid[r][c + len] === t) len++;
                            for (let i = 0; i < len; i++) matched.add(`${r},${c + i}`);
                        }
                    }
                }
                // vertical
                for (let c = 0; c < COLS; c++) {
                    for (let r = 0; r < ROWS - 2; r++) {
                        const t = grid[r][c];
                        if (t !== null && t === grid[r + 1][c] && t === grid[r + 2][c]) {
                            let len = 3;
                            while (r + len < ROWS && grid[r + len][c] === t) len++;
                            for (let i = 0; i < len; i++) matched.add(`${r + i},${c}`);
                        }
                    }
                }
                return Array.from(matched).map(k => {
                    const [r, c] = k.split(',');
                    return { r: +r, c: +c };
                });
            }

            function hasValidMoves() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (c < COLS - 1) {
                            swapData(r, c, r, c + 1);
                            if (findMatches().length > 0) { swapData(r, c, r, c + 1); return true; }
                            swapData(r, c, r, c + 1);
                        }
                        if (r < ROWS - 1) {
                            swapData(r, c, r + 1, c);
                            if (findMatches().length > 0) { swapData(r, c, r + 1, c); return true; }
                            swapData(r, c, r + 1, c);
                        }
                    }
                }
                return false;
            }

            function swapData(r1, c1, r2, c2) {
                [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
            }

            function isAdjacent(r1, c1, r2, c2) {
                return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
            }

            // ── Render ──
            function renderBoard(animClass = null, staggerFalling = false) {
                boardGrid.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        if (animClass) cell.classList.add(animClass);
                        if (staggerFalling && animClass === 'falling') {
                            cell.style.animationDelay = `${r * 0.04 + c * 0.015}s`;
                        }
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        const gem = document.createElement('div');
                        gem.className = `gem gem-${grid[r][c]}`;
                        gem.textContent = GEM_EMOJIS[grid[r][c]];
                        cell.appendChild(gem);
                        cell.addEventListener('pointerdown', (e) => onCellClick(r, c, e));
                        boardGrid.appendChild(cell);
                    }
                }
            }

            // ── Swap Animation ──
            async function animateSwapVisual(r1, c1, r2, c2) {
                const cell1 = getCellEl(r1, c1);
                const cell2 = getCellEl(r2, c2);
                if (!cell1 || !cell2) return;
                const gem1 = cell1.querySelector('.gem');
                const gem2 = cell2.querySelector('.gem');
                if (!gem1 || !gem2) return;

                const center1 = getCellCenter(cell1);
                const center2 = getCellCenter(cell2);
                const dx = center2.x - center1.x;
                const dy = center2.y - center1.y;

                const opts = { duration: 170, easing: 'cubic-bezier(0.32, 0.72, 0.25, 1)', fill: 'forwards' };
                const a1 = gem1.animate([
                    { transform: 'translate(0, 0)', zIndex: 5 },
                    { transform: `translate(${dx}px, ${dy}px)`, zIndex: 5 }
                ], opts);
                const a2 = gem2.animate([
                    { transform: 'translate(0, 0)', zIndex: 5 },
                    { transform: `translate(${-dx}px, ${-dy}px)`, zIndex: 5 }
                ], opts);

                await Promise.all([a1.finished, a2.finished]);
                // Reset transforms by re-rendering
            }

            // ── Ripple Effect ──
            function spawnRipple(cell) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                const size = cell.offsetWidth;
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = '50%';
                ripple.style.top = '50%';
                ripple.style.marginLeft = -size / 2 + 'px';
                ripple.style.marginTop = -size / 2 + 'px';
                cell.appendChild(ripple);
                setTimeout(() => ripple.remove(), 500);
            }

            // ── Cell Click ──
            function onCellClick(r, c, event) {
                if (!gameRunning || processing || paused) return;

                const cell = getCellEl(r, c);
                if (cell) spawnRipple(cell);

                if (activeBooster) {
                    applyBooster(activeBooster, r, c);
                    return;
                }

                if (selected === null) {
                    selected = { r, c };
                    const el = getCellEl(r, c);
                    if (el) el.classList.add('selected');
                } else {
                    const { r: sr, c: sc } = selected;
                    const prevEl = getCellEl(sr, sc);
                    if (prevEl) prevEl.classList.remove('selected');

                    if (sr === r && sc === c) {
                        selected = null;
                        return;
                    }
                    if (isAdjacent(sr, sc, r, c)) {
                        selected = null;
                        attemptSwap(sr, sc, r, c);
                    } else {
                        selected = { r, c };
                        const el = getCellEl(r, c);
                        if (el) el.classList.add('selected');
                    }
                }
            }

            // ── Swap Logic ──
            async function attemptSwap(r1, c1, r2, c2) {
                processing = true;
                clearSelection();

                // Visually animate the swap
                await animateSwapVisual(r1, c1, r2, c2);

                // Perform swap in data
                swapData(r1, c1, r2, c2);
                const matches = findMatches();

                if (matches.length === 0) {
                    // No match — animate back
                    await animateSwapVisual(r1, c1, r2, c2);
                    swapData(r1, c1, r2, c2);
                    renderBoard();
                    // Shake feedback on the two cells
                    [getCellEl(r1, c1), getCellEl(r2, c2)].forEach(el => {
                        if (el) {
                            el.style.animation = 'none';
                            el.offsetHeight;
                            el.style.animation = 'hintPulse 0.35s ease';
                            setTimeout(() => el.style.animation = '', 350);
                        }
                    });
                    processing = false;
                    updateUI();
                    return;
                }

                moves++;
                renderBoard();
                await processMatches();
                processing = false;
                updateUI();
                checkGameOver();
            }

            function clearSelection() {
                if (selected) {
                    const el = getCellEl(selected.r, selected.c);
                    if (el) el.classList.remove('selected');
                    selected = null;
                }
            }

            // ── Match Processing ──
            async function processMatches() {
                combo = 1;
                let anyMatch = true;
                let totalCascadeMatches = 0;

                while (anyMatch && gameRunning) {
                    const matches = findMatches();
                    if (matches.length === 0) { anyMatch = false; break; }

                    totalCascadeMatches += matches.length;
                    const pts = Math.floor(matches.length * 10 * combo * wave * (1 + matches.length / 12));
                    score += pts;
                    matchesInWave += matches.length;
                    coins += Math.floor(matches.length * combo * 0.6);
                    if (score > record) record = score;

                    // Effects
                    await animateMatches(matches);
                    showFloatScore(pts, matches);
                    spawnParticles(matches);
                    if (combo >= 3) {
                        boardWrapper.classList.add('shake');
                        setTimeout(() => boardWrapper.classList.remove('shake'), 400);
                        showComboPopup(combo, matches);
                    }
                    if (combo >= 2) {
                        comboPill.classList.add('pulse');
                        setTimeout(() => comboPill.classList.remove('pulse'), 300);
                    }

                    // Remove matched
                    matches.forEach(({ r, c }) => { grid[r][c] = null; });

                    // Gravity
                    await gravityDropAnimated();
                    // Fill
                    fillBoard();
                    renderBoard('falling', true);
                    await sleep(300);

                    combo++;
                    updateUI();
                    await sleep(160);

                    // Check wave completion
                    if (matchesInWave >= getWaveTarget(wave)) {
                        await triggerWave();
                    }

                    // Safety: if too many cascades, break
                    if (combo > 20) break;
                }
                combo = Math.max(1, combo - 1);
                updateUI();
            }

            async function animateMatches(matches) {
                const batchSize = 8;
                for (let i = 0; i < matches.length; i += batchSize) {
                    const batch = matches.slice(i, i + batchSize);
                    batch.forEach(({ r, c }) => {
                        const el = getCellEl(r, c);
                        if (el) el.classList.add('matched');
                    });
                    await sleep(50);
                }
                await sleep(320);
            }

            async function gravityDropAnimated() {
                // Compress columns
                for (let c = 0; c < COLS; c++) {
                    let emptySlots = 0;
                    for (let r = ROWS - 1; r >= 0; r--) {
                        if (grid[r][c] === null) emptySlots++;
                        else if (emptySlots > 0) {
                            grid[r + emptySlots][c] = grid[r][c];
                            grid[r][c] = null;
                        }
                    }
                }
            }

            function fillBoard() {
                for (let r = 0; r < ROWS; r++)
                    for (let c = 0; c < COLS; c++)
                        if (grid[r][c] === null) grid[r][c] = randomGem();
            }

            async function triggerWave() {
                wave++;
                matchesInWave = 0;
                const bonus = wave * 50 + Math.floor(wave * wave * 1.5);
                score += bonus;
                coins += wave * 5;
                if (score > record) record = score;

                // Wave banner
                $('wb-title').textContent = `WAVE ${wave}`;
                $('wb-sub').textContent = wave % 3 === 0 ? '🔥 Огненная волна!' :
                    wave % 2 === 0 ? '⚡ Ускорение!' : 'Бонус за волну!';
                $('wb-bonus').textContent = `+${bonus} 🪙`;
                waveBanner.classList.add('show');

                // Celebration particles
                for (let i = 0; i < 18; i++) {
                    setTimeout(() => {
                        const p = document.createElement('div');
                        p.className = 'particle';
                        p.textContent = ['🎉', '✨', '🌟', '💫', '🎊', '💎'][Math.floor(Math.random() * 6)];
                        p.style.left = (30 + Math.random() * 40) + '%';
                        p.style.top = (40 + Math.random() * 15) + '%';
                        p.style.fontSize = (18 + Math.random() * 20) + 'px';
                        document.body.appendChild(p);
                        setTimeout(() => p.remove(), 1000);
                    }, i * 40);
                }

                await sleep(2000);
                waveBanner.classList.remove('show');
                await sleep(400);
                updateUI();
            }

            // ── Boosters ──
            function applyBooster(type, r, c) {
                if (boosters[type] <= 0 || !gameRunning) return;
                boosters[type]--;
                processing = true;
                deactivateBooster();

                let affected = [];
                if (type === 'bomb') {
                    for (let dr = -1; dr <= 1; dr++)
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr,
                                nc = c + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] !== null)
                                affected.push({ r: nr, c: nc });
                        }
                } else if (type === 'swirl') {
                    const t = grid[r][c];
                    for (let rr = 0; rr < ROWS; rr++)
                        for (let cc = 0; cc < COLS; cc++)
                            if (grid[rr][cc] === t) affected.push({ r: rr, c: cc });
                } else if (type === 'bolt') {
                    for (let cc = 0; cc < COLS; cc++)
                        if (grid[r][cc] !== null) affected.push({ r, c: cc });
                    for (let rr = 0; rr < ROWS; rr++)
                        if (grid[rr][c] !== null && rr !== r) affected.push({ r: rr, c });
                }

                const pts = affected.length * 15 * wave;
                score += pts;
                matchesInWave += affected.length;
                coins += Math.floor(affected.length * 1.5);
                if (score > record) record = score;

                showFloatScore(pts, affected);
                spawnParticles(affected);
                affected.forEach(({ r, c }) => {
                    const el = getCellEl(r, c);
                    if (el) el.classList.add('matched');
                    grid[r][c] = null;
                });

                updateBoosterUI();
                updateUI();

                setTimeout(async () => {
                    await sleep(350);
                    await gravityDropAnimated();
                    fillBoard();
                    renderBoard('falling', true);
                    await sleep(200);
                    await processMatches();
                    processing = false;
                    updateUI();
                    checkGameOver();
                }, 50);
            }

            function activateBooster(type) {
                if (!gameRunning || paused || boosters[type] <= 0) return;
                if (activeBooster === type) {
                    deactivateBooster();
                    return;
                }
                deactivateBooster();
                activeBooster = type;
                const btn = document.getElementById(`booster-${type}`);
                if (btn) btn.classList.add('active-booster');
                const messages = {
                    bomb: '💣 Выберите клетку для взрыва (3×3)!',
                    swirl: '🌀 Выберите камень — удалятся все такие же!',
                    bolt: '⚡ Выберите клетку — удар по строке и столбцу!'
                };
                hintText.textContent = messages[type] || '';
                hintText.classList.add('alert');
            }

            function deactivateBooster() {
                if (activeBooster) {
                    const btn = document.getElementById(`booster-${activeBooster}`);
                    if (btn) btn.classList.remove('active-booster');
                    activeBooster = null;
                    hintText.textContent = 'Собирайте комбинации и зарабатывайте очки';
                    hintText.classList.remove('alert');
                }
            }

            function updateBoosterUI() {
                ['bomb', 'swirl', 'bolt'].forEach(b => {
                    const countEl = document.getElementById(`${b}-count`);
                    const btn = document.getElementById(`booster-${b}`);
                    if (countEl) countEl.textContent = boosters[b];
                    if (btn) {
                        if (boosters[b] <= 0) btn.classList.add('depleted');
                        else btn.classList.remove('depleted');
                    }
                });
            }

            // ── UI Updates ──
            function updateUI() {
                scoreDisplay.textContent = score.toLocaleString();
                recordDisplay.textContent = record.toLocaleString();
                waveDisplay.textContent = wave;
                comboDisplay.textContent = `x${combo}`;
                coinsDisplay.textContent = coins.toLocaleString();
                // Wave progress
                const target = getWaveTarget(wave);
                const progress = Math.min(100, Math.round((matchesInWave / target) * 100));
                waveProgressFill.style.width = progress + '%';
                updateBoosterUI();
                saveRecord();
            }

            function showFloatScore(pts, cells) {
                if (!cells.length) return;
                const mid = cells[Math.floor(cells.length / 2)];
                const el = getCellEl(mid.r, mid.c);
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const div = document.createElement('div');
                div.className = 'float-score';
                div.textContent = `+${pts}`;
                div.style.left = rect.left + rect.width / 2 + 'px';
                div.style.top = rect.top + rect.height / 2 + 'px';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 1050);
            }

            function showComboPopup(comboVal, cells) {
                if (!cells.length) return;
                const mid = cells[Math.floor(cells.length / 2)];
                const el = getCellEl(mid.r, mid.c);
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const div = document.createElement('div');
                div.className = 'combo-popup';
                div.textContent = `COMBO x${comboVal}!`;
                div.style.left = rect.left + rect.width / 2 + 'px';
                div.style.top = rect.top + 'px';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 1400);
            }

            function spawnParticles(cells) {
                const emojis = ['✨', '💫', '⭐', '🌟', '💥', '🔥'];
                const count = Math.min(cells.length, 8);
                const shuffled = [...cells].sort(() => Math.random() - 0.5).slice(0, count);
                shuffled.forEach(({ r, c }, i) => {
                    const el = getCellEl(r, c);
                    if (!el) return;
                    const rect = el.getBoundingClientRect();
                    setTimeout(() => {
                        const div = document.createElement('div');
                        div.className = 'particle';
                        div.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                        div.style.left = (rect.left + Math.random() * rect.width) + 'px';
                        div.style.top = (rect.top + Math.random() * rect.height) + 'px';
                        div.style.fontSize = (14 + Math.random() * 16) + 'px';
                        document.body.appendChild(div);
                        setTimeout(() => div.remove(), 950);
                    }, i * 25);
                });
            }

            // ── Game State ──
            function startNewGame() {
                score = 0;
                wave = 1;
                combo = 1;
                coins = 0;
                moves = 0;
                matchesInWave = 0;
                boosters = { bomb: 3, swirl: 2, bolt: 3 };
                activeBooster = null;
                gameRunning = true;
                paused = false;
                processing = false;
                gameOverShown = false;

                gameoverOverlay.classList.remove('show');
                mainBtn.textContent = '⏸ Пауза';
                mainBtn.classList.remove('paused');
                hintText.textContent = 'Собирайте комбинации и зарабатывайте очки';
                hintText.classList.remove('alert');
                clearSelection();
                boardWrapper.classList.remove('shake');

                initGrid();
                renderBoard('new-gem');
                updateUI();
                loadRecord();
                updateBoosterUI();
            }

            function handleMainBtn() {
                if (!gameRunning) { startNewGame(); return; }
                if (gameOverShown) { startNewGame(); return; }
                paused = !paused;
                if (paused) {
                    mainBtn.textContent = '▶ Продолжить';
                    mainBtn.classList.add('paused');
                    hintText.textContent = '⏸ Игра на паузе';
                    deactivateBooster();
                } else {
                    mainBtn.textContent = '⏸ Пауза';
                    mainBtn.classList.remove('paused');
                    hintText.textContent = 'Собирайте комбинации и зарабатывайте очки';
                }
            }

            function checkGameOver() {
                if (!gameRunning || gameOverShown) return;
                if (!hasValidMoves()) {
                    gameOverShown = true;
                    gameRunning = false;
                    paused = false;
                    deactivateBooster();
                    clearSelection();
                    $('go-score').textContent = score.toLocaleString();
                    $('go-best').textContent = 'Рекорд: ' + record.toLocaleString();
                    gameoverOverlay.classList.add('show');
                    mainBtn.textContent = '▶ Новая игра';
                    mainBtn.classList.remove('paused');
                    hintText.textContent = 'Нет доступных ходов!';
                    saveRecord();
                }
            }

            function saveRecord() {
                const saved = parseInt(localStorage.getItem('nova-record-v3') || '0');
                if (record > saved) localStorage.setItem('nova-record-v3', record);
            }

            function loadRecord() {
                record = parseInt(localStorage.getItem('nova-record-v3') || '0');
                updateUI();
            }

            // ── Leaderboard ──
            const MOCK_LB = [
                { name: 'Cosmo', score: 185420, avatar: '🚀' },
                { name: 'Quantum', score: 112640, avatar: '⚛️' },
                { name: 'Neutron', score: 89210, avatar: '🌌' },
                { name: 'Orbit', score: 75410, avatar: '🪐' },
                { name: 'Photon', score: 58960, avatar: '🔦' },
                { name: 'Stellar', score: 43780, avatar: '⭐' },
                { name: 'Nebula', score: 32150, avatar: '🌠' },
                { name: 'Pulsar', score: 21900, avatar: '💫' },
            ];

            let lbFilter = 'world';

            function setLbFilter(f) {
                lbFilter = f;
                $('lb-world-btn').classList.toggle('active', f === 'world');
                $('lb-friends-btn').classList.toggle('active', f === 'friends');
                renderLeaderboard();
            }

            function renderLeaderboard() {
                const list = $('lb-list');
                const rankEmojis = ['🥇', '🥈', '🥉'];
                const rankColors = ['gold', 'silver', 'bronze'];

                let items = [...MOCK_LB];
                const myScore = record;

                if (lbFilter === 'friends') {
                    items = items.slice(0, 4);
                    items.push({ name: 'You', score: myScore, avatar: '👤', isMe: true });
                    items.sort((a, b) => b.score - a.score);
                } else {
                    items.push({ name: 'You', score: myScore, avatar: '👤', isMe: true });
                    items.sort((a, b) => b.score - a.score);
                }

                list.innerHTML = items.map((p, i) => {
                    const rank = i + 1;
                    const rankCls = rank <= 3 ? rankColors[rank - 1] : '';
                    const rankStr = rank <= 3 ? rankEmojis[rank - 1] : `#${rank}`;
                    return `
                <div class="lb-item ${p.isMe ? 'me' : ''}">
                  <div class="lb-rank ${rankCls}">${rankStr}</div>
                  <div class="lb-avatar">${p.avatar}</div>
                  <div class="lb-info"><div class="lb-name">${p.name}</div></div>
                  <div class="lb-score-num">${p.score.toLocaleString()}</div>
                </div>`;
                }).join('');

                // League
                const myRank = items.findIndex(p => p.isMe) + 1;
                const pct = myRank <= 1 ? 1 : myRank <= 3 ? 5 : myRank <= items.length * 0.15 ? 10 : myRank <= items
                    .length * 0.3 ? 20 : 35;
                const leagueData = myRank === 1 ? { icon: '👑', name: 'Чемпион' } :
                    myRank <= 3 ? { icon: '💎', name: 'Алмазная лига' } :
                    myRank <= 5 ? { icon: '🥈', name: 'Платиновая лига' } : { icon: '🥉', name: 'Золотая лига' };
                document.querySelector('.league-icon').textContent = leagueData.icon;
                document.querySelector('.league-name').textContent = leagueData.name;
                $('league-rank-text').textContent = myScore > 0 ? `Топ ${pct}%` :
                'Сыграйте, чтобы войти в рейтинг';
            }

            function switchTab(tab) {
                const gv = $('game-view');
                const lv = $('lb-view');
                $('tab-game').classList.toggle('active', tab === 'game');
                $('tab-lb').classList.toggle('active', tab === 'lb');
                gv.style.display = tab === 'game' ? 'flex' : 'none';
                lv.classList.toggle('active', tab === 'lb');
                if (tab === 'lb') renderLeaderboard();
                if (tab === 'game' && gameRunning && paused) {
                    // keep pause state
                }
            }

            // ── Global exposure ──
            window.switchTab = switchTab;
            window.setLbFilter = setLbFilter;
            window.activateBooster = activateBooster;
            window.handleMainBtn = handleMainBtn;
            window.startNewGame = startNewGame;

            // ── Init ──
            loadRecord();
            renderLeaderboard();
            startNewGame();
            updateBoosterUI();
        })();
    </script>
</body>
</html>
