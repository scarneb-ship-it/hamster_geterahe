<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f39c12">
    <title>Hamster GameDev Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Top bar with balance -->
        <div class="top-bar">
            <div class="balance-display">
                <span class="coin-icon">🪙</span>
                <span id="coin-balance">0</span>
            </div>
            <div class="app-title">Hamster Hub</div>
        </div>

        <!-- Main content tabs -->
        <main class="main-content">
            <!-- 2048 Game Tab -->
            <section id="game-tab" class="tab-content active">
                <div class="game-container">
                    <div class="game-header">
                        <h2>2048</h2>
                        <div class="scores">
                            <div class="score-box"><span class="label">Счёт</span><span id="score">0</span></div>
                            <div class="score-box"><span class="label">Рекорд</span><span id="best-score">0</span></div>
                        </div>
                    </div>
                    <div class="game-board" id="game-board"></div>
                    <div class="game-controls">
                        <button class="btn-new-game" id="new-game-btn">Новая игра</button>
                        <div class="boosts">
                            <button class="boost-btn" id="boost-undo" title="Отменить ход (50 монет)">↩️ 50</button>
                            <button class="boost-btn" id="boost-remove" title="Убрать плитку (100 монет)">🧹 100</button>
                        </div>
                    </div>
                    <div id="game-message" class="game-message"></div>
                    <div class="daily-goal">
                        <span>🎯 Ежедневная цель: <span id="daily-target">5000</span> очков</span>
                        <span id="daily-progress">0 / 5000</span>
                        <button id="claim-daily-btn" disabled>Забрать +200 🪙</button>
                    </div>
                </div>
            </section>

            <!-- Quests Tab -->
            <section id="quests-tab" class="tab-content">
                <h2>🎯 Задания</h2>
                <div class="quests-section">
                    <h3>🎮 Игры</h3>
                    <div id="game-quests-list" class="quests-list"></div>
                </div>
                <div class="quests-section">
                    <h3>📊 Биржи</h3>
                    <div id="exchange-quests-list" class="quests-list"></div>
                </div>
            </section>

            <!-- Referrals Tab -->
            <section id="referrals-tab" class="tab-content">
                <h2>👥 Рефералы</h2>
                <div class="referral-stats">
                    <div class="stat-card">
                        <span class="stat-value" id="ref-count">0</span>
                        <span class="stat-label">приглашено</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-value" id="ref-earned">0</span>
                        <span class="stat-label">монет заработано</span>
                    </div>
                </div>
                <div class="ref-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="ref-progress-fill" style="width: 0%"></div>
                    </div>
                    <span id="ref-progress-text">0 / 5 друзей для бонуса</span>
                </div>
                <button class="share-btn" id="share-ref-btn">🔗 Пригласить друга</button>
                <div id="ref-leaderboard" class="ref-leaderboard">
                    <h3>🏆 Топ рефереров</h3>
                    <div id="ref-leaderboard-list">Загрузка...</div>
                </div>
            </section>

            <!-- Profile Tab -->
            <section id="profile-tab" class="tab-content">
                <div class="profile-card">
                    <div class="avatar" id="user-avatar">
                        <img id="avatar-img" src="" alt="Avatar" style="display:none">
                        <span id="avatar-fallback">H</span>
                    </div>
                    <div class="user-info">
                        <h3 id="user-name">Hamster</h3>
                        <p id="user-username">@hamster_gamedev</p>
                    </div>
                </div>
                <div class="balance-section">
                    <h4>Мой баланс</h4>
                    <div class="big-balance">
                        <span class="coin-icon">🪙</span>
                        <span id="profile-balance">0</span>
                    </div>
                </div>
                <div class="achievements">
                    <h4>🏅 Достижения</h4>
                    <div id="achievements-list" class="achievements-list"></div>
                </div>
                <div class="settings-section">
                    <h4>⚙️ Настройки</h4>
                    <label class="setting-item">
                        <span>Вибрация</span>
                        <input type="checkbox" id="vibration-toggle" checked>
                    </label>
                    <label class="setting-item">
                        <span>Звук</span>
                        <input type="checkbox" id="sound-toggle">
                    </label>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="game-tab">🎲<span>2048</span></button>
            <button class="nav-btn" data-tab="quests-tab">📋<span>Задания</span></button>
            <button class="nav-btn" data-tab="referrals-tab">👥<span>Рефералы</span></button>
            <button class="nav-btn" data-tab="profile-tab">👤<span>Профиль</span></button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
